; ESP32 C3 Super Mini Development Board
; https://www.espboards.dev/esp32/esp32-c3-super-mini/
[env:esp32c3_super_mini]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3_base.build_flags}
  -D ESP32C3
  -I variants/esp32c3/diy/esp32c3_super_mini
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Angkasa board v1: no WiFi antenna/use-case, no IMU/compass, no env/air-quality/PIR sensor,
  ; no PSRAM for store&forward. Trim these to reduce RAM/flash on the C3's small SRAM.
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  ; POWER_TELEMETRY (external INA219/226/260/3221/MAX17048 power-monitor ICs) shares driver
  ; plumbing with ENVIRONMENTAL_SENSOR upstream and isn't buildable with only one excluded.
  ; This board has no such IC wired up, so drop it too; basic on-device battery % is unaffected.
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
board_level = extra
